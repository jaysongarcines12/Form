<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Registration Form</h1>

  <form action="#" method="post">

    <div class="field">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" required>
    </div>

    <div class="field">
      <label for="birthdate">Birth Date</label>
      <input type="date" id="birthdate" name="birthdate" required>
    </div>

    <div class="field">
      <label for="program">Program</label>
      <select id="program" name="program" required>
        <option value="">-- Select a program --</option>
        <option value="bsit">BS Information Technology</option>
        <option value="bscs">BS Computer Science</option>
        <option value="bsis">BS Information Systems</option>
        <option value="bscpe">BS Computer Engineering</option>
      </select>
    </div>

    <fieldset class="inline">
      <legend>Preferred Contact Method</legend>
      <input type="radio" id="contact-email" name="contact" value="email" checked>
      <label for="contact-email">Email</label>
      <input type="radio" id="contact-phone" name="contact" value="phone">
      <label for="contact-phone">Phone</label>
      <input type="radio" id="contact-sms" name="contact" value="sms">
      <label for="contact-sms">SMS</label>
    </fieldset>

    <fieldset class="inline">
      <legend>Interests</legend>
      <input type="checkbox" id="int-web" name="interests" value="web">
      <label for="int-web">Web Development</label>
      <input type="checkbox" id="int-mobile" name="interests" value="mobile">
      <label for="int-mobile">Mobile Apps</label>
      <input type="checkbox" id="int-data" name="interests" value="data">
      <label for="int-data">Data</label>
      <input type="checkbox" id="int-iot" name="interests" value="iot">
      <label for="int-iot">IoT</label>
    </fieldset>

    <div class="field">
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4"></textarea>
    </div>

    <button type="submit">Submit</button>

  </form>

</body>
</html>
